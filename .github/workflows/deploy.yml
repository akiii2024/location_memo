name: Verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.35.3
  ENABLE_AI: "false"

jobs:
  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: Install rule-test dependencies
        working-directory: firebase
        run: npm ci
      - name: Test Firestore and Storage rules
        run: npx --yes firebase-tools@13.35.1 emulators:exec --project demo-location-memo --only firestore,storage "npm --prefix firebase test"

  build:
    runs-on: ubuntu-latest
    needs: firebase-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 解析・テストもFirebase初期化コードをコンパイルするため最初に復元する。
      - name: Restore Firebase configuration
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: |
          test -n "$FIREBASE_OPTIONS_DART" || (echo "FIREBASE_OPTIONS_DART secret is missing" >&2; exit 1)
          test -n "$GOOGLE_SERVICES_JSON" || (echo "GOOGLE_SERVICES_JSON secret is missing" >&2; exit 1)
          test -n "$RECAPTCHA_ENTERPRISE_SITE_KEY" || (echo "RECAPTCHA_ENTERPRISE_SITE_KEY secret is missing" >&2; exit 1)
          printf '%s' "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - run: flutter --version
      - name: Pin Flutter to JDK 17
        run: flutter config --jdk-dir "$JAVA_HOME"
      - run: flutter pub get
      - name: Generate adapters
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build PWA
        run: >-
          flutter build web --release
          --base-href /location_memo/
          --no-wasm-dry-run
          --dart-define=ENABLE_AI=false
          --dart-define=RECAPTCHA_ENTERPRISE_SITE_KEY=${{ secrets.RECAPTCHA_ENTERPRISE_SITE_KEY }}

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 secret is missing" >&2; exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "ANDROID_STORE_PASSWORD secret is missing" >&2; exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS secret is missing" >&2; exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD secret is missing" >&2; exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - name: Build signed Android App Bundle
        run: flutter build appbundle --release --dart-define=ENABLE_AI=false

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: location-memo-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
